name: cloud-scan

# Runs JobRadar on GitHub-hosted runners so scanning continues with your laptop closed.
# Required repo secrets (Settings → Secrets and variables → Actions):
#   DISCORD_WEBHOOK_URL and/or DISCORD_WEBHOOK_PRIORITY / _FORTUNE500 / _OTHER
#   NTFY_TOPIC (optional)
#   NOTION_TOKEN, NOTION_DATABASE_ID (optional but recommended)
# Optional Gmail secrets for inbox → labels + Notion status sync:
#   GMAIL_CLIENT_SECRETS_JSON  (contents of secrets/gmail-client.json)
#   GMAIL_TOKEN_JSON           (contents of secrets/gmail-token.json)
# After secrets are added: Actions → cloud-scan → Run workflow (or push to main).

on:
  schedule:
    # Every 5 minutes (GitHub minimum). Offset from :00/:05/…; public repo = free Actions minutes.
    # Cron can still slip a few minutes under load.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloud-scan.yml"
      - "src/jobradar/**"
  workflow_dispatch:
    inputs:
      gmail_days:
        description: "Gmail lookback days when Gmail secrets are set"
        required: false
        default: "3"
      test_discord:
        description: "Post one Discord test message before scanning"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read

concurrency:
  group: jobradar-cloud-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Restore SQLite cache
        uses: actions/cache@v4
        with:
          path: data/jobradar.db
          key: jobradar-db-${{ github.repository }}-${{ github.run_id }}
          restore-keys: |
            jobradar-db-${{ github.repository }}-

      - name: Write env
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_PRIORITY: ${{ secrets.DISCORD_WEBHOOK_PRIORITY }}
          DISCORD_WEBHOOK_FORTUNE500: ${{ secrets.DISCORD_WEBHOOK_FORTUNE500 }}
          DISCORD_WEBHOOK_OTHER: ${{ secrets.DISCORD_WEBHOOK_OTHER }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          JOBRADAR_ALERTS_ENABLED: ${{ vars.JOBRADAR_ALERTS_ENABLED || '1' }}
          JOBRADAR_MAX_ALERTS_PER_SCAN: ${{ vars.JOBRADAR_MAX_ALERTS_PER_SCAN || '15' }}
          JOBRADAR_NOTIFY_WINDOW_DAYS: ${{ vars.JOBRADAR_NOTIFY_WINDOW_DAYS || '3' }}
          JOBRADAR_REQUIRE_POSTED_AT: ${{ vars.JOBRADAR_REQUIRE_POSTED_AT || '1' }}
        run: |
          mkdir -p data secrets
          touch data/jobradar.db
          {
            echo "DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}"
            echo "DISCORD_WEBHOOK_PRIORITY=${DISCORD_WEBHOOK_PRIORITY}"
            echo "DISCORD_WEBHOOK_FORTUNE500=${DISCORD_WEBHOOK_FORTUNE500}"
            echo "DISCORD_WEBHOOK_OTHER=${DISCORD_WEBHOOK_OTHER}"
            echo "NTFY_TOPIC=${NTFY_TOPIC}"
            echo "NTFY_SERVER=${NTFY_SERVER:-https://ntfy.sh}"
            echo "TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}"
            echo "TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}"
            echo "NOTION_TOKEN=${NOTION_TOKEN}"
            echo "NOTION_DATABASE_ID=${NOTION_DATABASE_ID}"
            echo "JOBRADAR_DB_PATH=data/jobradar.db"
            echo "JOBRADAR_NOTIFY_MOCK_PATH=data/notifications.jsonl"
            echo "JOBRADAR_LINK_PROBE=${JOBRADAR_LINK_PROBE:-1}"
            echo "JOBRADAR_NOTIFY_WINDOW_DAYS=${JOBRADAR_NOTIFY_WINDOW_DAYS:-3}"
            echo "JOBRADAR_REQUIRE_POSTED_AT=${JOBRADAR_REQUIRE_POSTED_AT:-1}"
            echo "JOBRADAR_MAX_ALERTS_PER_SCAN=${JOBRADAR_MAX_ALERTS_PER_SCAN:-15}"
            echo "JOBRADAR_ALERTS_ENABLED=${JOBRADAR_ALERTS_ENABLED:-1}"
            echo "GMAIL_CLIENT_SECRETS=secrets/gmail-client.json"
            echo "GMAIL_TOKEN=secrets/gmail-token.json"
          } > .env

      - name: Require Discord secrets
        id: discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_PRIORITY: ${{ secrets.DISCORD_WEBHOOK_PRIORITY }}
          DISCORD_WEBHOOK_FORTUNE500: ${{ secrets.DISCORD_WEBHOOK_FORTUNE500 }}
          DISCORD_WEBHOOK_OTHER: ${{ secrets.DISCORD_WEBHOOK_OTHER }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL$DISCORD_WEBHOOK_PRIORITY$DISCORD_WEBHOOK_FORTUNE500$DISCORD_WEBHOOK_OTHER" ]; then
            echo "::error::Cloud-scan cannot alert: add DISCORD_WEBHOOK_URL (or _PRIORITY / _FORTUNE500 / _OTHER) under Settings → Secrets → Actions. Copy the same values from your Mac .env. Without this, only local scan can Discord — which is why opening the laptop floods listings."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "Discord webhook secrets present."

      - name: Write Gmail secrets (optional)
        env:
          GMAIL_CLIENT_SECRETS_JSON: ${{ secrets.GMAIL_CLIENT_SECRETS_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          if [ -n "$GMAIL_CLIENT_SECRETS_JSON" ] && [ -n "$GMAIL_TOKEN_JSON" ]; then
            printf '%s' "$GMAIL_CLIENT_SECRETS_JSON" > secrets/gmail-client.json
            printf '%s' "$GMAIL_TOKEN_JSON" > secrets/gmail-token.json
            echo "gmail_secrets=true" >> "$GITHUB_ENV"
          else
            echo "gmail_secrets=false" >> "$GITHUB_ENV"
            echo "Gmail secrets not set — skipping gmail-sync (scan still runs)."
          fi

      - name: Health
        run: python -m jobradar health

      - name: Discord test ping
        # Manual only — never on schedule/push (those used to spam channels on every merge)
        if: github.event_name == 'workflow_dispatch' && (github.event.inputs.test_discord == 'true' || github.event.inputs.test_discord == true)
        run: python -m jobradar test-discord

      - name: Scan once
        run: |
          python -m jobradar scan --once | tee /tmp/scan-out.txt
          echo "## Cloud scan" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/scan-out.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Gmail sync
        if: env.gmail_secrets == 'true'
        run: python -m jobradar gmail-sync --days "${{ github.event.inputs.gmail_days || '3' }}" --max 150
