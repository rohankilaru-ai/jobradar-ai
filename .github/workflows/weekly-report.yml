name: weekly-report

on:
  schedule:
    - cron: "0 16 * * 0"  # Sundays 16:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e .

      - name: Restore SQLite cache
        uses: actions/cache@v4
        with:
          path: data/jobradar.db
          key: jobradar-db-${{ github.repository }}-weekly
          restore-keys: |
            jobradar-db-${{ github.repository }}-

      - run: mkdir -p data && touch data/jobradar.db

      - name: Write weekly markdown
        run: python -m jobradar weekly-report

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/weekly/
          git diff --staged --quiet || git commit -m "Weekly JobRadar report $(date -u +%Y-%m-%d)"
          git push
